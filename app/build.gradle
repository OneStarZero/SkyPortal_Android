plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sky.portal'
    compileSdk 34

    defaultConfig {
        applicationId "com.sky.portal"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
