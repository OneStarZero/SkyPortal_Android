name: Build Signed APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 🌟 核心 1：把 Base64 私钥解码还原成 keystore 文件
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore
        echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 🌟 核心 2：注入签名密码并执行打包
    - name: Build Signed Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease --no-daemon --parallel --build-cache --configure-on-demand

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: SkyPortal-Signed-APK
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7
