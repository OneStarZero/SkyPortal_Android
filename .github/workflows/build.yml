name: Build Optimized APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' # 极速缓存：自动缓存 Gradle 依赖

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 极速构建：开启并行、按需配置、无守护进程，直接产出经过高度混淆的 Release 包
    - name: Build Release APK
      run: gradle assembleRelease --no-daemon --parallel --build-cache --configure-on-demand

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SkyPortal-Release-Optimized
        # 输出路径是 release 文件夹下的 app-release.apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7
